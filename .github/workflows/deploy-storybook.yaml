name: Build Storybook artifact

# Builds the interactive web Storybook for review. Wcash does not have an
# approved external Storybook deployment target, so the result stays inside
# GitHub Actions as a downloadable artifact.

on:
  push:
    branches: [dev]
    paths:
      - 'components/**'
      - 'app/theme/**'
      - 'app/AppState/**'
      - '.storybook-web/**'
      - 'assets/**'

permissions:
  contents: read

concurrency:
  group: build-storybook
  cancel-in-progress: true

jobs:
  build:
    name: Build Storybook artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - run: yarn

      - run: yarn build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: wcash-storybook
          path: storybook-static
