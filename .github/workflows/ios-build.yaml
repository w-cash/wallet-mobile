name: Wcash iOS native build

on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      advisory:
        # Advisory mode: job failures are recorded but do not fail the
        # caller, for runs where iOS is informational (per-PR CI) rather
        # than a gate (nightly).
        required: false
        default: false
        type: boolean

env:
  CACHE-KEY: ${{ inputs.cache-key }}

jobs:
  ios-check-build-cache:
    name: Check build cache
    continue-on-error: ${{ inputs.advisory }}
    runs-on: macos-15
    outputs:
      ios-cache-found: ${{ steps.ios-set-cache-found.outputs.ios-cache-found }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify immutable Wcash dependency graph
        run: |
          set -eu
          if grep -nE 'path[[:space:]]*=[[:space:]]*"/' rust/Cargo.toml; then
            echo 'absolute local Rust dependencies block every native cache and candidate build' >&2
            exit 1
          fi
          test "$(grep -c '^name = "wcash-wallet"$' rust/Cargo.lock)" -eq 1
          ! grep -q '5b4e29980eb45e84ddab9024f530c923986d7e1e' rust/Cargo.lock
          cargo tree --locked --manifest-path rust/Cargo.toml \
            --package wcash-mobile-ffi --invert wcash-wallet

      - name: Check if iOS xcframework cache exists
        id: ios-check-build-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ios/Zingolib.xcframework
            ios/zingo.swift
            ios/ZingoNymProxyFFI.xcframework
            ios/zingo_nym_proxy_ffi.swift
          key: wcash-ios-xcframework-${{ env.CACHE-KEY }}
          lookup-only: true

      - name: Verify cached Wcash-only boundary
        if: ${{ steps.ios-check-build-cache.outputs.cache-hit == 'true' }}
        run: |
          set -eu
          grep -q 'setWalletDirectory' ios/zingo.swift
          find ios/Zingolib.xcframework -type f -perm -111 -print0 \
            | xargs -0 strings | grep -q 'set_wallet_directory'

      - name: Set cache-found
        id: ios-set-cache-found
        run: echo "ios-cache-found=${{ steps.ios-check-build-cache.outputs.cache-hit }}" >> $GITHUB_OUTPUT

  ios-build:
    name: Build Wcash iOS Rust xcframework
    needs: ios-check-build-cache
    if: ${{ needs.ios-check-build-cache.outputs.ios-cache-found != 'true' }}
    continue-on-error: ${{ inputs.advisory }}
    runs-on: macos-15
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
      CARGO_HOME:  ${{ github.workspace }}/.cargo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cargo default stable
        run: |
          rustup update
          rustup upgrade
          rustup default stable

      # Placed after the toolchain steps on purpose: rust-cache reads
      # `rustc -vV` into its key, and RUSTUP_HOME here is a workspace-relative
      # dir that has no default toolchain until the step above installs one.
      #
      # Two workspaces: the shim is excluded from the main one (own lockfile,
      # see rust/Cargo.toml), so its target dir needs listing separately. It
      # was missing from the cache this replaces, which is why the 24 minutes
      # of nym-sdk were never cacheable at all.
      #
      # What it replaces: a plain actions/cache over .cargo + rust/target that
      # never once hit. It stored 4.6 GB unpruned, the repo's cache store
      # evicted it before the next iOS build needed it, and every run logged
      # "Cache not found for input keys: ios-cargo-..." and then spent 8m30
      # re-uploading it. rust-cache prunes to dependency artifacts only, which
      # is all this job needs: zingolib and nym-sdk are git/registry deps, not
      # workspace members, and compiling them is nearly the whole 45 minutes.
      #
      # Saved from dev only. A cache written on refs/pull/N/merge is invisible
      # to every other PR, so per-PR saves buy nothing and only add eviction
      # pressure; the dev copy is readable by all of them.
      - name: Cargo cache (registry, git, iOS targets)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/nym-proxy-ffi
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: Install bindgen-cli (needed by aws-lc-sys, ring etc.)
        run: cargo install --force --locked bindgen-cli

      - name: Install protoc
        run: brew install protobuf

      - name: Install iOS Rust targets (device + simulator)
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      # this issue is solved in bindgen 0.70
      # But we have a dependency that are using a incompatible version 0.69.
      - name: Cargo env for iOS sim (bindgen/cc)
        shell: bash
        run: |
          mkdir -p .cargo
          SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          cat > .cargo/config.toml <<EOF
          [env]
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios_sim = "--target=arm64-apple-ios-simulator -isysroot $SDKROOT"
          CFLAGS_aarch64_apple_ios_sim = "--target=arm64-apple-ios-simulator -isysroot $SDKROOT"
          CXXFLAGS_aarch64_apple_ios_sim = "--target=arm64-apple-ios-simulator -isysroot $SDKROOT"
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Build iOS Rust xcframework
        run: node rust/ios/build_ios.mjs

      - name: Verify Wcash-only boundary and native identity
        run: |
          set -eu
          grep -q "'--package', 'wcash-mobile-ffi'" rust/ios/build_ios.mjs
          ! grep -q "'--package', 'zingo-lib'" rust/ios/build_ios.mjs
          grep -q 'setWalletDirectory(directory:' ios/RPCModule.swift
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.wcashwallet.wallet;' \
            ios/Zingo.xcodeproj/project.pbxproj
          grep -q 'INFOPLIST_KEY_CFBundleDisplayName = "Wcash Wallet";' \
            ios/Zingo.xcodeproj/project.pbxproj
          grep -q '<string>wcash</string>' ios/Zingo/Info.plist
          grep -q 'setWalletDirectory' ios/zingo.swift
          find ios/Zingolib.xcframework -type f -perm -111 -print0 \
            | xargs -0 strings | grep -q 'set_wallet_directory'

      - name: Upload xcframework artifact
        uses: actions/upload-artifact@v7
        with:
          name: wcash-ios-xcframework-${{ env.CACHE-KEY }}
          path: |
            ios/Zingolib.xcframework
            ios/zingo.swift
            ios/ZingoNymProxyFFI.xcframework
            ios/zingo_nym_proxy_ffi.swift
          retention-days: 3

  cache-native-ios-uniffi:
    name: Cache Wcash iOS xcframework
    needs: ios-build
    continue-on-error: ${{ inputs.advisory }}
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download xcframework artifact
        uses: actions/download-artifact@v4
        with:
          name: wcash-ios-xcframework-${{ env.CACHE-KEY }}
          path: ios

      - name: Cache xcframework
        uses: actions/cache/save@v6
        with:
          path: |
            ios/Zingolib.xcframework
            ios/zingo.swift
            ios/ZingoNymProxyFFI.xcframework
            ios/zingo_nym_proxy_ffi.swift
          key: wcash-ios-xcframework-${{ env.CACHE-KEY }}
