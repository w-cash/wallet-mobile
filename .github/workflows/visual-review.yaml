name: Visual review

# Builds the PR head, captures it with the web Storybook harness, and diffs
# it against the committed baseline (visual/__baseline__). The check fails
# when a story changed, appeared, or disappeared without a baseline update.
# Accepting is a local commit: run `yarn visual:accept` to pull the capture
# into the baseline, review it, and commit the accepted pixels.

on:
  pull_request:
    paths:
      - 'screens/**'
      - 'ui/**'
      - 'app/theme/**'
      - 'app/AppState/**'
      - '.storybook-web/**'
      - 'visual/**'
      - 'assets/**'

permissions:
  contents: read

# Cancel a superseded run when the PR gets a new push.
concurrency:
  group: visual-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-review:
    name: Visual review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: yarn

      - run: yarn

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Capture PR head
        run: VISUAL_OUT=visual/ci/head yarn visual:snapshot

      # The bundle `yarn visual:accept` downloads to become the baseline.
      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-head
          path: visual/ci/head

      # Ship the head build alongside the report so the Current tab embeds it.
      - name: Assemble Current view
        run: cp -r storybook-static visual/ci/storybook

      - name: Stage baseline into the report
        run: cp -r visual/__baseline__ visual/ci/baseline

      - name: Diff head vs baseline
        id: diff
        continue-on-error: true
        run: >-
          VISUAL_CURRENT=visual/ci/head
          VISUAL_BASELINE=visual/ci/baseline
          VISUAL_REPORT=visual/ci/index.html
          VISUAL_STORYBOOK=storybook/index.html
          yarn tsx visual/diff.mts

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: visual/ci

      - name: Gate
        if: steps.diff.outcome != 'success'
        run: |
          echo "Visual changes detected. Download the visual-review artifact, review index.html, then run 'yarn visual:accept' locally and commit visual/__baseline__ if accepted."
          exit 1
