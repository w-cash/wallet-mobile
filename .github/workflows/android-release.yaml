name: Wcash native candidate QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-candidate:
    name: Android ARM64 Wcash boundary candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Require immutable Wcash dependencies
        run: |
          set -eu
          ! grep -nE 'path[[:space:]]*=[[:space:]]*"/' rust/Cargo.toml
          test "$(grep -c '^name = "wcash-wallet"$' rust/Cargo.lock)" -eq 1
          ! grep -q '5b4e29980eb45e84ddab9024f530c923986d7e1e' rust/Cargo.lock

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'ndk;28.2.13676358'

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-18-dev cmake protobuf-compiler
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - run: |
          cargo install --locked bindgen-cli
          cargo install --locked --version 4.0.1 cargo-ndk

      - name: Build Wcash-only Android boundary
        working-directory: rust
        env:
          CARGO_NDK_ANDROID_PLATFORM: 26
          CARGO_NDK_PLATFORM: 26
          CFLAGS_aarch64_linux_android: -mno-outline-atomics
          CXXFLAGS_aarch64_linux_android: -mno-outline-atomics
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          cargo run --locked --release --package zingo-uniffi-bindgen \
            --bin zingo-wallet-uniffi-bindgen -- \
            generate wcash-mobile-ffi/src/zingo.udl --language kotlin \
            --no-format --out-dir "$RUNNER_TEMP/wcash-kotlin"
          cargo ndk --target aarch64-linux-android build --locked --release \
            --package wcash-mobile-ffi
          test -f target/aarch64-linux-android/release/libzingo.so
          grep -R -q 'setWalletDirectory' "$RUNNER_TEMP/wcash-kotlin"
          nm -g target/aarch64-linux-android/release/libzingo.so \
            | grep -q 'ffi_zingo_uniffi_contract_version'

      - name: Upload unsigned Wcash Android boundary
        uses: actions/upload-artifact@v4
        with:
          name: wcash-android-arm64-native-candidate
          path: |
            rust/target/aarch64-linux-android/release/libzingo.so
            ${{ runner.temp }}/wcash-kotlin

  ios-candidate:
    name: iOS ARM64 simulator Wcash boundary candidate
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Require immutable Wcash dependencies
        run: |
          set -eu
          ! grep -nE 'path[[:space:]]*=[[:space:]]*"/' rust/Cargo.toml
          test "$(grep -c '^name = "wcash-wallet"$' rust/Cargo.lock)" -eq 1
          ! grep -q '5b4e29980eb45e84ddab9024f530c923986d7e1e' rust/Cargo.lock

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - run: brew install protobuf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - run: cargo install --locked bindgen-cli

      - name: Build Wcash-only iOS simulator boundary
        working-directory: rust
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '16.0'
        run: |
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios_sim="--target=arm64-apple-ios-simulator -isysroot $simulator_sdk"
          export CFLAGS_aarch64_apple_ios_sim="--target=arm64-apple-ios-simulator -isysroot $simulator_sdk"
          export CXXFLAGS_aarch64_apple_ios_sim="$CFLAGS_aarch64_apple_ios_sim"
          cargo run --locked --release --package zingo-uniffi-bindgen \
            --bin zingo-wallet-uniffi-bindgen -- \
            generate wcash-mobile-ffi/src/zingo.udl --language swift \
            --no-format --out-dir "$RUNNER_TEMP/wcash-swift"
          cargo build --locked --release --target aarch64-apple-ios-sim \
            --package wcash-mobile-ffi
          test -f target/aarch64-apple-ios-sim/release/libzingo.a
          grep -q 'setWalletDirectory' "$RUNNER_TEMP/wcash-swift/zingo.swift"
          nm -g target/aarch64-apple-ios-sim/release/libzingo.a \
            | grep -q 'ffi_zingo_uniffi_contract_version'
          cp "$RUNNER_TEMP/wcash-swift/zingoFFI.modulemap" \
            "$RUNNER_TEMP/wcash-swift/module.modulemap"
          xcrun swiftc -typecheck "$RUNNER_TEMP/wcash-swift/zingo.swift" \
            -I "$RUNNER_TEMP/wcash-swift"

      - name: Upload unsigned Wcash iOS simulator boundary
        uses: actions/upload-artifact@v4
        with:
          name: wcash-ios-arm64-simulator-native-candidate
          path: |
            rust/target/aarch64-apple-ios-sim/release/libzingo.a
            ${{ runner.temp }}/wcash-swift
