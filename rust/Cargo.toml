[workspace]
members = [
    "lib",
    "wcash-mobile-adapter",
    "wcash-mobile-ffi",
    "android",
    "ios",
    "zingomobile_utils",
    "workbench",
    "uniffi-bindgen",
]

# The mixnet proxy shim resolves in its own lockfile: nym-sdk's transitive
# graph needs `crypto-common ^0.2`, irreconcilable with this workspace's pins.
exclude = ["nym-proxy-ffi"]
resolver = "2"

[workspace.dependencies]
zingolib = { git = "https://github.com/w-cash/wallet-core.git", rev = "58bc22ec63bbe3eddab5f961c137836431589c95", features = [
    "nym",
    "perspective",
] }
pepper-sync = { git = "https://github.com/w-cash/wallet-core.git", rev = "58bc22ec63bbe3eddab5f961c137836431589c95" }
zingolib_testutils = { git = "https://github.com/w-cash/wallet-core.git", rev = "58bc22ec63bbe3eddab5f961c137836431589c95" }
# Corrective integration uses the reviewed local proposal split at
# 8f61c6a36e5eca756d93ba02ec5567fb03c8b312. Replace this workspace path with
# that immutable remote revision immediately after it is published.
wcash-wallet = { path = "/Users/rustdev/Documents/Codex/2026-09-12/weh/work/Wcash/wolf-cli-proposal/wcash-wallet" }
regchest_utils = { git = "https://github.com/zingolabs/zingo-regchest", branch = "dev" }
zingomobile_utils = { path = "zingomobile_utils" }

zcash_address = "0.13.0"
zcash_client_backend = { version = "0.24.0-rc.1", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
] }
zcash_keys = { version = "0.16.1", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_protocol = "0.10.0"

zingo_common_components = "0.4.0"
zip32 = "0.2.0"
uniffi = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
rustls = { version = "0.23.37", features = ["ring"] }
serde_json = "1"
android_logger = "0.11"
http = "1"
hex = "0.4"
json = "0.12"
lazy_static = "1.4.0"
log = "0.4"
uniffi_build = "0.29"
thiserror = "1"
once_cell = "1"
bip0039 = { version = "0.14", features = ["rand"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
rusqlite = "0.37"
tempfile = "3"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
overflow-checks = true
panic = "abort"
opt-level = "z"

[profile.test]
opt-level = 3
debug = 1

[patch.crates-io]
# Wcash consensus domains and transaction parsing. These immutable revisions
# match the selection audited by wallet-core and wolf.
pczt = { git = "https://github.com/w-cash/wolf.git", rev = "9a9c0668784117f116d5b69bdb3a090765092343" }
zcash_primitives = { git = "https://github.com/w-cash/wolf.git", rev = "9a9c0668784117f116d5b69bdb3a090765092343" }
zcash_protocol = { git = "https://github.com/w-cash/wolf.git", rev = "9a9c0668784117f116d5b69bdb3a090765092343" }
# Ironwood (NU6.3) proto fields (CompactTx.ironwoodActions, TreeState.ironwoodTree,
# ShieldedProtocol.ironwood, ChainMetadata.ironwoodCommitmentTreeSize). Must match
# the patch in zingolib (feat/ironwood) so the dependency graph resolves to a single
# ironwood-aware lightwallet-protocol.
lightwallet-protocol = { git = "https://github.com/zingolabs/lightwallet-protocol-rust", rev = "9bdfdc77eb283f2a3d26c27100cc2ac90148cd93" }

# Local-only corrective validation: force wallet-core's transitive runtime to
# the same reviewed Wolf boundary as the additive mobile adapter. Replace this
# path patch and the direct path above with the published immutable revisions
# before any release candidate is permitted.
[patch."https://github.com/w-cash/wolf.git"]
wcash-wallet = { path = "/Users/rustdev/Documents/Codex/2026-09-12/weh/work/Wcash/wolf-cli-proposal/wcash-wallet" }
