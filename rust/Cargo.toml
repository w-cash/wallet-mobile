[workspace]
members = [
    "wcash-mobile-adapter",
    "wcash-mobile-ffi",
    "android",
    "ios",
    "zingomobile_utils",
    "workbench",
    "uniffi-bindgen",
]

# The byte-identical upstream FFI and mixnet shim remain in the source tree for
# provenance only. Wcash builds use wcash-mobile-ffi and must never compile
# either legacy boundary.
exclude = ["lib", "nym-proxy-ffi"]
resolver = "2"

[workspace.dependencies]
zingolib = { git = "https://github.com/w-cash/wallet-core.git", rev = "d10113e19c712a403c1b68947c2186e97f61f854", features = [
    "perspective",
] }
pepper-sync = { git = "https://github.com/w-cash/wallet-core.git", rev = "d10113e19c712a403c1b68947c2186e97f61f854" }
zingolib_testutils = { git = "https://github.com/w-cash/wallet-core.git", rev = "d10113e19c712a403c1b68947c2186e97f61f854" }
wcash-wallet = { git = "https://github.com/w-cash/wolf.git", rev = "168b59310056964a6347ed993ace8f8d1385cde1" }
regchest_utils = { git = "https://github.com/zingolabs/zingo-regchest", branch = "dev" }
zingomobile_utils = { path = "zingomobile_utils" }

zcash_address = "0.13.0"
zcash_client_backend = { version = "0.24.0-rc.1", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
] }
zcash_keys = { version = "0.16.1", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_protocol = "0.10.0"

zingo_common_components = "0.4.0"
zip32 = "0.2.0"
uniffi = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
rustls = { version = "0.23.37", features = ["ring"] }
serde_json = "1"
android_logger = "0.11"
http = "1"
hex = "0.4"
json = "0.12"
lazy_static = "1.4.0"
log = "0.4"
uniffi_build = "0.29"
thiserror = "1"
once_cell = "1"
bip0039 = { version = "0.14", features = ["rand"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
rusqlite = "0.37"
tempfile = "3"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
overflow-checks = true
panic = "abort"
opt-level = "z"

[profile.test]
opt-level = 3
debug = 1

[patch.crates-io]
# Wcash consensus domains and transaction parsing. These immutable revisions
# match the selection audited by wallet-core and wolf.
pczt = { git = "https://github.com/w-cash/wolf.git", rev = "9a9c0668784117f116d5b69bdb3a090765092343" }
zcash_primitives = { git = "https://github.com/w-cash/wolf.git", rev = "9a9c0668784117f116d5b69bdb3a090765092343" }
zcash_protocol = { git = "https://github.com/w-cash/wolf.git", rev = "9a9c0668784117f116d5b69bdb3a090765092343" }
# Ironwood (NU6.3) proto fields (CompactTx.ironwoodActions, TreeState.ironwoodTree,
# ShieldedProtocol.ironwood, ChainMetadata.ironwoodCommitmentTreeSize). Must match
# the patch in zingolib (feat/ironwood) so the dependency graph resolves to a single
# ironwood-aware lightwallet-protocol.
lightwallet-protocol = { git = "https://github.com/zingolabs/lightwallet-protocol-rust", rev = "9bdfdc77eb283f2a3d26c27100cc2ac90148cd93" }
